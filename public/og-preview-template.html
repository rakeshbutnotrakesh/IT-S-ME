<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OG Social Preview Template — Rakesh Kumar Mondal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Manrope:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        background: #E7E7E2;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        font-family: "Inter", sans-serif;
      }
      .card {
        width: 1200px;
        height: 630px;
        background: #F8F8F5;
        padding: 48px;
        display: flex;
      }
      .frame {
        flex: 1;
        background: #FFFFFF;
        border: 1.5px solid #E7E7E2;
        border-radius: 16px;
        padding: 56px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding-bottom: 28px;
        border-bottom: 1px solid #E7E7E2;
      }
      .logo {
        font-family: "Manrope", sans-serif;
        font-size: 32px;
        font-weight: 800;
        color: #171717;
        letter-spacing: -0.03em;
      }
      .logo span { color: #315EF5; }
      .role {
        font-family: "JetBrains Mono", monospace;
        font-size: 16px;
        color: #737373;
      }
      h1 {
        font-family: "Manrope", sans-serif;
        font-size: 66px;
        font-weight: 800;
        color: #171717;
        letter-spacing: -0.03em;
        line-height: 1.05;
      }
      .sub {
        font-size: 28px;
        color: #595959;
        margin-top: 16px;
      }
      .sub span { color: #315EF5; font-weight: 600; }
      .bottom {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding-top: 28px;
        border-top: 1px solid #E7E7E2;
        font-family: "JetBrains Mono", monospace;
        font-size: 18px;
      }
      .stack { color: #315EF5; font-weight: 500; }
      .url { color: #737373; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="frame">
        <div class="top">
          <div class="logo">RKM<span>.</span></div>
          <div class="role">BCA STUDENT · DEVELOPER · AUTOMATION ENTHUSIAST</div>
        </div>
        <div>
          <h1>Rakesh Kumar Mondal</h1>
          <p class="sub">Building thoughtful digital experiences through <span>code</span>.</p>
        </div>
        <div class="bottom">
          <div class="stack">C / C++ · Python · React · TypeScript · Docker · n8n</div>
          <div class="url">portfolio-two-puce-hj49ocwerj.vercel.app</div>
        </div>
      </div>
    </div>
  </body>
</html>
