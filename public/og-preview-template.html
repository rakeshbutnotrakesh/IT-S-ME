<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1200, initial-scale=1.0" />
    <title>OG Social Preview Template (1200x630)</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #0b0b0c;
        color: #f5f5f3;
        font-family: 'Bricolage Grotesque', system-ui, -apple-system, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 48px;
      }
      .card {
        width: 100%;
        height: 100%;
        border-radius: 20px;
        border: 2px solid rgba(245, 245, 243, 0.14);
        background: #131316;
        padding: 56px 60px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .top { display: flex; align-items: center; gap: 20px; }
      .badge {
        width: 72px; height: 72px; border-radius: 16px;
        background: linear-gradient(135deg, #ff4d2e, #f59e0b);
        display: flex; align-items: center; justify-content: center;
        font-weight: 800; font-size: 24px; color: #fff;
      }
      .kicker { font-family: ui-monospace, monospace; color: #ff6b4a; font-size: 20px; font-weight: 600; }
      .sub { font-family: ui-monospace, monospace; color: #b0b0b8; font-size: 18px; margin-top: 4px; }
      h1 { font-size: 64px; font-weight: 800; line-height: 1.05; letter-spacing: -0.03em; }
      .role { font-size: 30px; color: #b0b0b8; margin-top: 14px; font-weight: 500; }
      .stack {
        border-top: 1px solid rgba(245,245,243,0.12);
        padding-top: 28px;
        display: flex; justify-content: space-between; align-items: center;
        font-family: ui-monospace, monospace;
      }
      .tech { color: #ff6b4a; font-size: 22px; font-weight: 600; }
      .url { color: #8e8e98; font-size: 18px; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="top">
        <div class="badge">RKM</div>
        <div>
          <div class="kicker">SOFTWARE DEVELOPER PORTFOLIO</div>
          <div class="sub">BCA · Swami Vivekananda University (2029)</div>
        </div>
      </div>
      <div>
        <h1>Rakesh Kumar Mondal</h1>
        <p class="role">Engineering Practical Web Software &amp; Automated Workflows</p>
      </div>
      <div class="stack">
        <span class="tech">Python · React · TypeScript · Docker · n8n</span>
        <span class="url">portfolio-two-puce-hj49ocwerj.vercel.app</span>
      </div>
    </div>
  </body>
</html>
